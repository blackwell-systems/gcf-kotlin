name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Check out gcf-kotlin and the shared-fixtures gcf repo as SIBLINGS so the
      # conformance runner's ../gcf/tests/conformance path (resolved from the
      # gradle process working directory, user.dir) finds the fixtures on CI.
      - uses: actions/checkout@v4
        with:
          path: gcf-kotlin
      - uses: actions/checkout@v4
        with:
          repository: blackwell-systems/gcf
          path: gcf
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.5
        working-directory: gcf-kotlin
      - name: Run tests (unit + shared-fixture conformance)
        run: ./gradlew test
        working-directory: gcf-kotlin
